designated_model: false

methods: >-
  LightGBM quantile regression using historical influenza hospitalizations,
  recent case trends, and seasonal peak features to forecast weekly admissions.

data_inputs: >-
  Historical weekly influenza hospital admissions from the CDC FluSight
  Forecast Hub target data.

methods_long: >-
  The Peak GBM model uses LightGBM gradient-boosted decision trees to
  generate probabilistic predictions of weekly influenza hospital
  admissions at national and jurisdictional levels.

  The model incorporates features derived from historical influenza
  hospitalization counts, recent temporal trends, and seasonal
  progression and peak indicators.

  Quantile forecasts are generated for the current epidemiological week
  and the following three weeks. The predictive distributions are
  represented using the quantile levels required by the CDC FluSight
  Forecast Hub.

  Historical rolling-origin backtesting is used to evaluate model
  performance, including weighted interval score, point forecast
  accuracy, and prediction interval coverage.

