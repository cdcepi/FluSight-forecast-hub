methods: "Online quantile calibration (MultiQT) applied post-hoc to the CMU-TimeSeries ensemble."
data_inputs: "Weekly incident flu hospitalizations and historical flusurv and ILI data, queried through Delphi Epidata API."
methods_long: "The CMU-TimeSeries ensemble (see CMU-TimeSeries.yml) with online quantile calibration applied via the MultiQT algorithm (Ding, Gibbs & Tibshirani 2025). Per (location, horizon) series, an additive offset over the 23 hub quantile levels is updated each round by online gradient descent on pinball loss with isotonic projection. The tracker runs on sqrt-transformed hospitalizations per 100k population with a constant learning rate (lr=0.018), starts cold each season with offsets carried across the off-season, and has no burn-in or slow persistent term."
