designated_model: true

data_inputs: CDC FluSight weekly influenza hospital-admission data; U.S. national observations.

methods: Seasonal Ridge regression using lagged hospital admissions, weekly changes, annual seasonal features, and horizon-specific empirical uncertainty calibration.

methods_long: >-
  Fit separate Ridge regression models for each forecast lead using
  historical weekly influenza hospital admissions. Each model uses
  four recent hospitalization observations, the latest weekly change,
  and annual sine and cosine seasonal features. Standardize predictors
  and apply L2 regularization with alpha=10. Train using observations
  available through the Saturday preceding the forecast reference date.
  Generate point forecasts for FluSight horizons 0 through 3 using
  model leads 1 through 4, respectively. Construct 23 quantile
  forecasts using horizon-specific historical rolling-origin prediction
  errors and the empirical uncertainty calibration procedure.
  Clip quantile forecasts at zero and round to nonnegative integers.
  Horizon -1 reports the latest observed hospitalization count as
  a diagnostic forecast. Historical calibration does not reconstruct
  every Wednesday release vintage, so fully real-time probabilistic
  performance has not yet been established.

ensemble_of_models: false
