data_inputs: "Weekly laboratory-confirmed influenza hospital admissions (NHSN / data.cdc.gov) and public epidemiological surveillance signals."
methods: "Median-based ensemble of quantile forecasts from AI agents; mean ensemble for categorical rate-trend and peak-week PMF forecasts."
methods_long: >-
  The Hubverse package hubEnsembles is used to generate the Xi_lab-Agents forecast from a suite of
  independent AI forecasting agents. A median of quantile outputs is used for all eligible
  quantile-based forecasts. The mean is used to ensemble probabilities from eligible categorical
  rate-trend and peak-week PMF forecasts.
