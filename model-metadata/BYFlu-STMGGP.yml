methods: "Gaussian process model with temporal, spatial, and unstructured season correlation components"
data_inputs: "weekly incident flu hospitalizations from HHS"
methods_long: "A Gaussian process model with a temporal component to capture covariance between weeks, 
               a spatial component to capture correlation between states, and a group prior to capture 
               unstructured correlation between seasons. Prior distributions are assigned to each 
               parameter and fitting is done via MCMC sampling."
