website_url: https://www.meyerlab.io/flusight_2026/
repo_url: https://github.com/ausmeyer/flusight_2026
license: CC-BY-4.0
designated_model: true
data_inputs: NHSN hospital admissions, NSSP influenza ED visits, national WastewaterSCAN influenza A,
  and historical ILINet/FluSurv-NET data.
methods: Two-stage LightGBM forecasts hospitalizations and ED visits; multiclass LightGBM
  predicts trends using surveillance history, seasonality, wastewater and ED signals.
methods_long: Separate pooled fits forecast hospitalizations and ED proportions, with Gaussian
  uncertainty on transformed scales. Models share information across locations without explicit
  spatial covariance. A separate multiclass LightGBM fit predicts hospitalization trend probabilities.
ensemble_of_models: false
ensemble_of_hub_models: false
backfill_adjustment: Models are refit weekly using the latest revised observations.
