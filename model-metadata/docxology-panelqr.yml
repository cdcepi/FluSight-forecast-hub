methods: "Direct pooled quantile autoregression over a seven-week seasonal target window: fourth-root target histories are robustly whitened per location, seven conditional quantile knots are fitted by..."
methods_long: "Proposed candidate docxology-panelqr, version 1.0.0. Direct pooled quantile autoregression over a seven-week seasonal target window: fourth-root target histories are robustly whitened per location, seven conditional quantile knots are fitted by ridge-stabilized IRLS, and a frozen log-location-scale transform maps them onto the FluSight grid. Histories are pooled across declared locations, sharing fitted quantile coefficients. No explicit geographic covariance model or jointly coherent sample trajectories are claimed. Target: wk inc flu hosp. Requested forecast horizons: [0, 1, 2, 3]. Submission value policy: integer; the submission adapter enforces nonnegative monotone quantiles. Each future submission must retain its actual input vintage, source/config identities and local validation. This draft does not assert scientific superiority, prospective selection/freeze, organizer registration or acceptance. Development-based configuration choices do not establish performance on this disease. The implementation, fitted-state records and detailed configuration are retained privately. This methods description does not grant a source-code license."
