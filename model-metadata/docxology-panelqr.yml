methods: "Direct pooled quantile autoregression over a seven-week seasonal window: fourth-root histories are whitened per location; nine conditional quantile knots are fitted by ridge-stabilized IRLS."
methods_long: "Revision of the registered candidate docxology-panelqr, version 1.1.0, dated 2026-11-02. Direct pooled quantile autoregression over a seven-week seasonal target window: fourth-root target histories are robustly whitened per location, nine conditional quantile knots (0.01, 0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95, 0.99) are fitted by ridge-stabilized IRLS, and a frozen log-location-scale transform maps them onto the FluSight grid. Histories are pooled across declared locations, sharing fitted quantile coefficients. No explicit geographic covariance model or jointly coherent sample trajectories are claimed. The 2026-11-02 modification replaces the version 1.0.0 seven-knot grid (0.01, 0.10, 0.25, 0.50, 0.75, 0.90, 0.99) with the nine-knot grid above, adding 0.05 and 0.95, which are declared FluSight levels with more empirical support inside the seasonal target window than the 0.025 boundary pair that the seven-knot parent linearly interpolates. The training window, fourth-root whitening, four lags, ridge scale and the frozen log1p centre shift 0.05 and spread multiplier 1.5 are unchanged. The revision takes effect only in rounds submitted after the local runtime migration; earlier rounds remain the version 1.0.0 configuration. Retrospective development and held-out evidence for this revision is small and is not a superiority claim. Target: wk inc flu hosp. Requested forecast horizons: [0, 1, 2, 3]. Submission value policy: integer; the submission adapter enforces nonnegative monotone quantiles. Each future submission must retain its actual input vintage, source/config identities and local validation. The implementation, fitted-state records and detailed configuration are retained privately. This methods description does not grant a source-code license."
