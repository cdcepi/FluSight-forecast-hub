data_inputs: "Weekly laboratory-confirmed influenza hospital admissions (NHSN, via the FluSight hub target-data with as-of snapshots, or the NHSN public API when the hub snapshot is not yet available); outpatient ILI from ILINet (via Delphi Epidata) as auxiliary pre-2022 history for the statistical components; specific humidity climatology for the mechanistic component; state population from the hub locations file."
methods: "Equal-weight quantile ensemble of six mechanistic, statistical, ML and foundation-model forecasts, shifted by a learned correction of its systematic residual (STS-Residual)."
methods_long: "
  Two stages. (1) Base ensemble: quantile-wise weighted average of five component forecasts for weekly incident influenza hospital admissions at the national and jurisdiction level: a humidity-driven SIR model with ensemble adjustment Kalman filter (SIR-EAKF); a seasonal-drift model using epiweek-matched historical trajectories with post-peak reversion; a SARIMAX model with epiweek-climatology and Fourier regressors; a pooled LightGBM quantile-regression model on per-capita log growth refit weekly; and the Chronos-2 and TimesFM-3.0 time-series foundation models used zero-shot on the NHSN history of all jurisdictions jointly. Equal weights were chosen over fitted weights because, once the residual correction is applied, learned weights gave no gain on the hub's log-scale evaluation metric in three seasons of vintage-honest hindcasts. (2) STS-Residual correction (Qin, Du & Pei 2026): the ensemble's systematic residual is learned from vintage-honest hindcasts of the same ensemble over the 2023-24, 2024-25 and 2025-26 seasons with three branches: a seasonal branch (mean normalized residual at the same epiweek and horizon, blended with the ensemble's recent nowcast error in the same jurisdiction, mixing weight and window chosen per horizon by leave-one-season-out cross-validation); a temporal branch (LSTM over the last four weeks of the components' residuals); and a spatial branch (LSTM + graph attention over neighbouring jurisdictions). Branch corrections are blended with weights chosen by cross-validation, bounded to one per-capita scale unit and added uniformly to all 23 quantiles, which are then truncated at zero, made monotone and rounded to integers. Peak-week and peak-incidence targets, when submitted, are derived from full-season sample trajectories whose first four weeks are quantile-mapped onto the corrected ensemble.
"
backfill_adjustment: "All training and hindcasting uses the as-of snapshots of the hub target data available on each forecast Wednesday (first-release counts for the latest week), so component models, the residual features and the recent-error term are fit to provisional counts while the correction targets the finalized counts; no explicit revision model is applied."
