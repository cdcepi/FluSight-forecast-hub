methods: "EpiRSI: an LLM agent writes data skills for frozen time-series foundation models and boosted trees, verified on past seasons; fixed greedy ensemble selection of the experts, no LLM at forecast time."
data_inputs: "NHSN weekly influenza admissions (hub target data as available at the deadline); ILINet, clinical laboratory percent positive (CDC FluView) and NSSP percent of emergency-department visits with influenza (Delphi Epidata, versions as of the deadline); outpatient claims share (Delphi Epidata, versions as of the deadline); US holiday calendar."
methods_long: "Experts run every week on the data available at the deadline: Chronos-2, TimesFM-3 and Toto-2 whose inputs are built by an agent-written skill (history back-extended with clinical positivity, ILINet and NSSP proxies; the newest reported weeks raised by learned factors for reporting delay, larger in holiday weeks; cross-jurisdiction and holiday covariates), further foundation models used as is (TiRex-2, t0-gamma), pooled LightGBM quantile regression on lagged features (also with ILINet as a joint series and with outpatient-claims covariates), and two simple mechanistic models. Skills were proposed by an LLM agent (Gemini 3.1 Pro) and accepted only if they improved the score in at least two thirds of 12 past seasons rebuilt with the data as of each deadline (NHSN 2023-24 and 2024-25, ILINet 2010-2023). The forecast is a fixed weighted average of the experts in log space: members and weights were chosen once by greedy forward ensemble selection with replacement (Caruana et al. 2004) on the same 12 past seasons - Chronos-2 with the skill inputs 0.4, TimesFM-3 on raw counts 0.3, LightGBM with claims covariates 0.1, LightGBM with the ILINet joint series 0.1, the log-space mean of the three foundation models 0.1 - and do not change during the season. Code frozen for the season; no manual adjustment; the LLM is not called at forecast time."
backfill_adjustment: "The input skill raises the newest reported weeks by factors learned on past seasons (about x1.16 and x1.06, larger in holiday weeks), adjusted by the recent trend of the auxiliary signals."
