methods: "EpiRSI: an LLM agent writes data skills for frozen time-series foundation models and boosted trees, verified on past seasons; fixed greedy ensemble selection of the experts, no LLM at forecast time."
data_inputs: "NHSN weekly influenza admissions (hub target data as available at the deadline); ILINet, clinical laboratory percent positive (CDC FluView) and NSSP percent of emergency-department visits with influenza (Delphi Epidata, versions as of the deadline); outpatient claims share (Delphi Epidata, versions as of the deadline); US holiday calendar."
methods_long: "Experts run every week on the data available at the deadline: Chronos-2, TimesFM-3 and Toto-2 whose inputs are built by an agent-written skill (the newest three reported weeks raised by the reporting revisions estimated at the deadline and bridged over the reporting lag with the week-to-week changes of NSSP and of a holiday-adjusted composite of ILINet and clinical positivity; holiday dips repaired from peer jurisdictions; each jurisdiction's series pooled with peer jurisdictions, with jurisdictions that led it in its own past and with a holiday-aware seasonal climatology, by empirical-Bayes weights; scale calibration by epidemic regime; spatial-diffusion, peer-percentile, leading-gap and turn-synchrony covariates and a regional clinical-positivity covariate; computed with a tool library the agent wrote in earlier search rounds), further foundation models used as is (TiRex-2, t0-gamma), pooled LightGBM quantile regression on lagged features (also with ILINet as a joint series and with outpatient-claims covariates), a LightGBM quantile regression whose training table is built by an agent-written skill (history back-extended over up to four years with clinical positivity or ILINet; ILINet and NSSP as leading covariates; neighbour, regional and national context features computed on targets corrected by the revision estimate; holiday and reporting-completeness flags with simulated reporting backfill; per-capita scaling; multiscale growth features; partly computed with a tool library the agent wrote in an earlier search round), and two simple mechanistic models. Skills were proposed by an LLM agent (Gemini 3.1 Pro) and accepted only if they improved the score in at least two thirds of 12 to 14 past seasons rebuilt with the data as of each deadline (NHSN 2023-24 and 2024-25, HHS Protect 2021-22 and 2022-23, ILINet 2010-2023); the LightGBM skill of model_version v16g26 comes from a later search whose acceptance test also included 2025-26 (at least 1% better on average over the NHSN seasons 2023-24 to 2025-26, none of them worse, the other seasons not worse on average) and replaced the earlier one after a pre-registered test on 15 past seasons; the input skill of the foundation models of model_version v17g26 was proposed by Gemini 4 Carbon (with dates and years removed from its prompts) in a search with the same acceptance test and replaced the earlier one after the same pre-registered test, repeated on top of v16g26. The forecast is a fixed weighted average of the experts in log space: members and weights are chosen once by greedy forward ensemble selection with replacement (Caruana et al. 2004) on 15 past seasons, the 14 above and 2025-26, with the newest weeks of the NHSN seasons as first released - the skill-built LightGBM 3/8, TimesFM-3 with the skill inputs 3/8, Chronos-2 with the skill inputs 2/8. During the season the members change only by a pre-registered change of the selection seasons (model_version v15g26 added 2025-26) or when a new expert passes the same multi-season test, pre-registered before its first use (model_version names the deployed version; v16g26 replaced the skill-built LightGBM, v17g26 the input skill of the foundation models); no manual adjustment; the LLM is not called at forecast time."
backfill_adjustment: "The input skill raises the newest three reported weeks by the reporting revisions estimated at the deadline from the season's earlier releases (pooled over jurisdictions) and bridges the newest weeks over the reporting lag with the week-to-week changes of NSSP and of a holiday-adjusted composite of ILINet and clinical positivity."
