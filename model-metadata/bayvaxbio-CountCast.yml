  "data_inputs": "Public CDC FluSight target data: weekly NHSN influenza hospital admissions, NSSP influenza ED-visit proportions, and jurisdiction populations/identifiers.",
  "methods": "Target-specific pooled ridge ensembles with damped trends, seasonal and national signals, and rolling empirical residual quantiles. Categorical rate-trend probabilities are derived from the hospitalization forecast distribution.",
  "methods_long": "Version 2.0.0 adds forecasts for wk inc flu prop ed visits while retaining the version 1.0.0 hospitalization method. Hospital forecasts use an 80% pooled ridge and 20% damped-growth blend on log1p counts, with local and national growth, seasonality, population, and jurisdiction effects. ED forecasts combine 75% pooled ridge on the proportion scale with 25% of a pooled ridge/damped-trend blend on the square-root scale. ED predictors include recent local and national ED levels and growth, weekly NHSN hospitalization rates and growth, seasonal harmonics, and jurisdiction effects. The ED target is modeled for the US, 50 states, and District of Columbia; Puerto Rico is absent from the public ED target data. Coefficients are refitted each week with exponentially downweighted history. Quantile uncertainty for both targets comes from horizon-specific rolling realized residuals with pooled and local information. ED component interval scales and ensemble weights were selected using revised-data diagnostics and replay of the 27 public 2025-26 issue vintages. Forecasts are clipped to official bounds, made monotone, and reported at the 23 required quantiles. Missing predictors are forward-filled from past observations; missing labels are excluded. No explicit spatial covariance or jointly coherent trajectories are modeled. Historical diagnostics do not guarantee future calibration. Source snapshots, timestamps, versions, and submission receipts are retained. Implementation and automation were developed with AI assistance under the contributor's direction. Version 2.1.0 adds optional categorical rate-trend forecasts (target wk flu hosp rate change). For each location and horizon the category probabilities are obtained by integrating the frozen hospitalization quantile forecast for the weekly change in admissions against the most recent official week (reference_date - 7 days). Outcome bins use the official horizon-specific rate thresholds together with the official count thresholds in auxiliary-data/locations.csv, including the rule that week pairs differing by fewer than 10 admissions are classified as stable. Probabilities are normalised; no additional fitted coefficients are introduced and the existing hospitalization and ED components are unchanged.",
  "ensemble_of_models": true,
  "ensemble_of_hub_models": false,
  "website_url": "https://github.com/cdcepi/FluSight-forecast-hub/blob/main/model-metadata/bayvaxbio-CountCast.yml",
  "model_version": "2.1.0",
  "backfill_adjustment": "No explicit reporting-delay or backfill correction. Each issue uses the current archived official target snapshots; if ED and hospital inputs end on the same week, the latest hospital signal is carried forward once rather than using future data.",
  "baseline_model": false,
  "designated_targets": [
    "wk inc flu hosp",
    "wk inc flu prop ed visits",
    "wk flu hosp rate change"
  ]
}
