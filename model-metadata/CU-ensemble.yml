data_inputs: "1) State specific weekly total number of hospitalized patients taken from the US Department of Health and Human Services, COVID-19 Reported Patient Impact and Hospital Capacity by State Timeseries (target data), 2) State specific weekly weighted influenza-like illness values downloaded from the CDC website"
methods: "The dynamical model simulates influenza transmission at state and national levels using a humidity-driven SIR model. States and parameters are updated weekly using the ensemble adjustment Kalman filter (EAKF), and forecasts are generated by integrating the optimized model forward. Statistical components include a seasonal-drift model based on historical incidence changes around the current epiweek, Holt-Winters exponential smoothing, LightGBM, and an unobserved component model. The ensemble also includes an anchored residual neural network (see CU-ARNB-NN). Historical ILI data transformed to resemble hospitalization data is used for model training, with laboratory data optionally included as a covariate. Component forecasts are weighted using the sum of inverse WIS over past weeks, with greater importance given to recent weeks. Weights are location- and horizon-specific, include only weeks for which WIS can be evaluated, and are recomputed each forecast week. Peak week and incidence distributions combine forecasts from the seasonal-drift and SIR-EAKF models."
backfill_adjustment: “To nowcast we are currently using censored Bayesian structural time-series over the current observed cases.”
team_funding: "US NIH grant GM110748, CSTE"
