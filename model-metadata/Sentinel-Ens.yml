data_inputs: "NHSN weekly influenza hospital admissions and their archived weekly versions (hub target data); NSSP share of ED visits for influenza (hub target data); CDC NWSS influenza A wastewater; Open-Meteo daily temperature and humidity; historical FluSurv-NET rates and ILINet x WHO/NREVSS ILI+ (2010-2022, via the UMass flusion repository)."
methods: "Average of three models: pooled log-growth regressions (ED visits, wastewater, weather), gradient-boosted quantile trees, and quantile autoregression."
methods_long: "We average the quantiles of three models with equal weights. (1) Eight pooled least-squares regressions, one for each combination of three signals (NSSP share of ED visits for flu, NWSS wastewater, a cold and dry weather index). They predict the change in log admissions over the next weeks from recent weekly changes, time of year, the level compared with the usual level for that location, terms that slow growth near the peak, and admissions so far this season. Recent weeks count more. Intervals come from past errors, scaled per location. (2) Gradient-boosted quantile trees (LightGBM, based on the UMass flusion approach) trained on NHSN plus about ten seasons of FluSurv-NET and ILI+ history on a fourth-root scale, bagged over seasons. (3) Quantile autoregression on the same scale (based on the CMU method), fitted on the same time of year in past seasons. Puerto Rico uses only the first two. The newest reported week is corrected for its usual later revision before it goes into the regressions and the trees. Rate change probabilities come from the same quantiles. We checked every design choice in a replay of the 2023-24 to 2025-26 seasons using the data as it was published each week. Code: https://github.com/xairu23/sentinel"
backfill_adjustment: "Yes. The newest reported week is scaled by its usual later revision, learned from the hub's archived data versions published before the forecast date."
ensemble_of_models: true
ensemble_of_hub_models: false
