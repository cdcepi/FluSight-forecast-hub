designated_targets: ["wk inc flu hosp"]
data_inputs: "Weekly incident flu hospital admissions from the NHSN Hospital Respiratory Dataset (hub target data and its weekly vintages); state populations from the hub's locations file."
methods: "Quantile average of two global gradient-boosted quantile regressions on the fourth root of admission rates, with a backfill correction of the latest weeks."
methods_long: "
  v1.0 (2026-11-12). Target: wk inc flu hosp, horizons -1 to 3, all hub locations.
  Scale: z = (admissions per 100k) ** 0.25. For the last reported week t and steps s = 1..4,
  one model per quantile level (sklearn HistGradientBoostingRegressor, quantile loss) predicts
  z[t+s] - z[t] from the recent trajectory (level, 1-, 2- and 4-week differences, 4-week mean,
  slope and spread), the 52-week maximum, the week of the season, log population and s. All
  locations are pooled; each model is fit on the current vintage only. Two such models, with and
  without the season-week and 52-week-maximum features, are averaged by quantile (weights 0.7
  and 0.3). Before fitting, the last two reported weeks are scaled by per-location backfill
  factors: the median ratio of later to first-reported values over the previous 12 rounds.
  Uncertainty comes from the quantile models; each quantile's distance from the median is then
  widened by a factor of 1.3 on the log scale to correct under-coverage seen in backtests. No
  spatial correlation is modelled beyond pooling. Horizon -1 is the backfill-adjusted last
  report with a narrow band.
  Backtest (89 past FluSight rounds, 2023-10-14 to 2026-10-31, using the data vintage available
  at each deadline): relative WIS to FluSight-baseline 0.69 (FluSight-ensemble 0.68); 2025-26
  season 0.59 (ensemble 0.66). The model choices were made on these backtests.
  "
ensemble_of_models: true
ensemble_of_hub_models: false
backfill_adjustment: "The last two reported weeks are multiplied by per-location median revision ratios estimated from the previous 12 rounds' data vintages."
baseline_model: false
