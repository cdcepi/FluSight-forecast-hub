methods: "An extended SLIR compartmental model defined as a branching process model with sequentially calibrated state estimation."
data_inputs: "Weekly confirmed influenza hospital admissions and the number of hospitals reporting in each jurisdiction."
methods_long: "EMBERS is a mechanistic and statistically interpretable model for inference of the effective reproduction number and population immunity. The epidemic is modelled as a branching process formulation of an extended SLIR compartmental model, calibrated with a marginal particle filter. A forecast is decomposed into two tasks: recovering the latent state of the epidemic, and propagating it forward under the dynamics. The forecast prior for future transmission is learned on past seasons while intrinsically incorporating susceptibility-depletion effects in transmission. Jurisdictions, including the US, are calibrated independently, however their forecasts are informed by other jurisdictions recovered latent state. \"Ensemble\" refers to the ensemble of particles, each carrying the moments of the epidemic state."
backfill_adjustment: "A reporting model fitted on historical NHSN data releases. For each jurisdiction, preliminary published counts are modeled jointly across recent weeks to capture correlated reporting delays, with jurisdiction-specific reporting completeness adjusted toward the national pattern. The model accommodates upward, downward, and flat revisions, and adjusts the most recent week for the proportion of hospitals reporting relative to each jurisdiction's seasonal median. It outputs a likelihood distribution over each week's final count, which the filter assimilates in place of raw counts."
