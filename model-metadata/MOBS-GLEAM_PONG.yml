methods: "Deep reinforcement learning inspired by Atari Pong for influenza hospitalization forecasting."
data_inputs: "Weekly incident flu hospitalizations from HHS"
methods_long: "This model approaches forecasting as a visual control task inspired by Atari Pong. 
Inspired by Atari agents that learn to play Pong from sequences of screens, the model learns 
to position and resize three selection bands over a binned representation of GLEAM simulated epidemic 
trajectories. These bands act as paddles for selecting candidate forecasts according to 
hospitalization magnitude, trend and curvature. Forecast quality provides the learning reward, 
guiding the agent toward trajectory selections that probabilistic forecasts."
