designated_model: true
data_inputs: "Weekly confirmed influenza hospital admissions from NHSN (preliminary weekly release, data.cdc.gov dataset mpgq-jmmr); historical ILINet data from before October 2022 (Delphi Epidata API); jurisdiction populations from the hub's auxiliary-data/locations.csv."
methods: "Equal-weight quantile-mean ensemble of a diverse set of models (ML, mechanistic, and statistical) generated autonomously by LLM-guided tree search (ERA)."
methods_long: "An equal-weight ensemble of a diverse set of influenza forecasting models (ML, mechanistic, and statistical) generated autonomously by Empirical Research Assistance (ERA), a system that uses LLM-guided tree search to write and optimise executable forecasting code (Aygün et al. 2026,Nature 654, 909–916). The component model code is published at https://github.com/google-research/google-research/tree/master/epi_forecasts. Each week every component is refitted on the latest data and produces the 23 hub quantiles of weekly incident influenza hospital admissions for horizons 0 to 3 in 52 jurisdictions (50 states, DC and Puerto Rico; no national forecast is submitted). The ensemble is the unweighted mean of the component values at each quantile level, computed separately for every location and horizon. Components are chosen by greedy forward selection on log WIS over the 2025-26 component forecasts, with separate component sets for the rising and declining phases of the season."
ensemble_of_models: true
