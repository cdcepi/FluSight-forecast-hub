designated_model: true
data_inputs: "CDC NHSN weekly influenza hospital admissions for all US states and the US national total; Prisma Health EHR surveillance data (weekly flu tests, positive tests, inpatient hospitalizations), used for South Carolina only"

methods: "Recursive quantile regression with analogs, EHR and cross-state signals, and multi-state pooling"
methods_long: "Recursive one-week-ahead quantile regression blended with phase-aware historical analogs, forecasting 0-3 weeks ahead by feeding each prediction back into the features. Predictors include lagged admissions, trend, seasonality, the share of US states with rising admissions, and for South Carolina, Prisma Health EHR data. A second quantile regression trained on all US states is blended in, and forecast growth is capped at a damped version of recently observed growth, with weights and damping tuned by rolling validation. The US national forecast uses the same approach without EHR inputs. Uncertainty comes from analog errors and model residuals. Updated October 2026"
