data_inputs: "CDC NHSN weekly influenza hospital admissions for all US states, DC, Puerto Rico and the US national total; NSSP weekly percent of emergency department visits due to influenza (FluSight hub target data); Prisma Health EHR surveillance data (weekly diagnoses, inpatient hospitalizations, ED visits, outpatient visits, tests, positive tests, vaccine counts and encounters), used for South Carolina only. For training a second model only: historical CDC ILINet percent of visits for influenza-like illness and WHO/NREVSS clinical laboratory percent positive (ILI+, 1997/98-2019/20), and CDC FluSurv-NET influenza hospitalization rates adjusted with CDC burden estimates (2010/11-2019/20), as compiled in the UMass Flusion repository"

methods: "Gradient-boosted quantile regression (LightGBM) pooled across all US locations, direct multi-horizon; averaged with a twin model also trained on 1997-2020 ILI+ and FluSurv-NET when that scores better"
methods_long: "Quantile regression with gradient-boosted trees (LightGBM, quantile objective), one model per horizon (0-3 weeks) and quantile (23), trained jointly on all US states, DC, Puerto Rico and the national total. Forecasts are submitted every week for all 53 FluSight locations: the US national total, all 50 states, the District of Columbia and Puerto Rico, all produced in one run by the same pooled models. Each model predicts the change in log weekly admissions from the last observed week to the target week directly, without recursion. Inputs: admission growth over 1-4 weeks, admissions per 100,000, distance below the past-year peak, the NSSP influenza ED-visit share (level, 1- and 2-week growth, distance below its past-year peak, ED growth minus admission growth), national admission and ED growth, season timing and population. For South Carolina only, the Prisma Health EHR weekly counts for the latest week and the week before are added through a second set of models; forecasts for all other locations, including the US national total, do not use Prisma data. Models are trained once per season on all weeks from March 2022 up to August 1 (the ED-share inputs are missing before October 2022). A second, otherwise identical 'history' model is also trained on historical ILI+ (ILINet percent ILI multiplied by clinical laboratory percent positive, 1997/98-2019/20 without the 2008/09 and 2009/10 pandemic seasons) and burden-adjusted FluSurv-NET hospitalization rates (2010/11-2019/20), each rescaled per location to the level of its NHSN admissions, with an input marking the data source; this history is used for training only, following the Flusion approach (Ray et al., Epidemics 2025). Every week both the single model's forecast and the equal-weight quantile average of the two models are produced. By a pre-specified rule applied automatically, the average is submitted once, on forecasts whose targets are at least two weeks old, it has a weighted interval score at least 5% lower than the single model across all locations and no higher for South Carolina over at least 4 forecast weeks; the single model is submitted otherwise, and again if the average later falls behind. Spatial correlation is not modeled explicitly: locations share information through the pooled models and the national growth inputs. Uncertainty comes from the 23 quantile models; prediction intervals are widened per horizon by factors learned from the previous season's real-time errors, and quantiles are sorted to prevent crossing. Updated November 2026; this version is used from reference date 2026-12-05."
