data_inputs: "NHSN weekly confirmed influenza hospital admissions (FluSight hub target data, vintage available at the forecast deadline)."
methods: "Per-location equal-weight linear pool of the 5 insight.cast candidate models with the lowest cross-validated WIS over 9 seasonally aligned origins."
methods_long: "Forecasts are produced with the insight.cast R package. For each location, candidate models (random walk, ETS, theta, ARIMA variants, NNETAR, endemic-epidemic HHH4 models and pretrained time-series foundation models (Chronos, TimesFM, Sundial)) are cross-validated at 9 origins: the reference date shifted back 52, 104 and 156 weeks and the two following weeks, scoring 4-week-ahead forecasts by weighted interval score. The five lowest-WIS candidates are refit on the latest data and combined with an equal-weight linear pool. Rate-change category probabilities are derived from the ensemble's predictive distribution relative to the most recently reported week."
ensemble_of_models: true
ensemble_of_hub_models: false
designated_targets: ["wk inc flu hosp", "wk flu hosp rate change"]
