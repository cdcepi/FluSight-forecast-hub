team_name: MIGHTE
team_abbr: MIGHTE
model_name: Fixed equal-weight time series ensemble
model_abbr: Nsemble
model_version: '3.0'
model_contributors:
- name: Austin Meyer
  affiliation: Baylor College of Medicine
  email: austin.g.meyer@gmail.com
- name: Mauricio Santillana
  affiliation: Northeastern University
  email: m.santillana@northeastern.edu
website_url: https://www.meyerlab.io/flusight_2026/
repo_url: https://github.com/ausmeyer/flusight_2026
license: CC-BY-4.0
designated_model: true
data_inputs: NHSN hospital admissions, national WastewaterSCAN influenza A, national NSSP influenza
  ED visits, and historical ILINet/FluSurv-NET data.
methods: Fixed equal-weight quantile ensemble of two-stage LightGBM bases and MIGHTE-Linear.
methods_long: For 2026–27, fixed weights replace adaptive weighting. Components estimate predictive
  uncertainty and share information across locations without explicit spatial covariance.
  Components include MIGHTE-Linear.
ensemble_of_models: true
ensemble_of_hub_models: true
backfill_adjustment: Models are refit weekly using the latest revised observations.
