team_name: MIGHTE
team_abbr: MIGHTE
model_name: Fixed equal-weight time series ensemble
model_abbr: Nsemble
model_version: '3.0'
model_contributors:
- name: Austin Meyer
  affiliation: Baylor College of Medicine
  email: austin.g.meyer@gmail.com
- name: Mauricio Santillana
  affiliation: Northeastern University
  email: m.santillana@northeastern.edu
website_url: https://github.com/ausmeyer/flusight_2026
repo_url: https://github.com/ausmeyer/flusight_2026
license: CC-BY-4.0
designated_model: true
data_inputs: Weekly NHSN influenza hospital admissions; historical ILINet/FluSurv-derived hospitalization
  proxies; seasonality. National WastewaterSCAN influenza A and NSSP influenza ED surveillance.
methods: Fixed equal-weight quantile average of wastewater-only and NSSP-only two-stage distributional
  LightGBM hospitalization models and partially pooled distributional autoregression.
methods_long: 'For 2026–27, MIGHTE-Nsemble is a fixed equal-weight average of forecast quantiles
  from three hospitalization models: a pooled two-stage distributional LightGBM with national WastewaterSCAN
  influenza A level and recent lags; the same model using national NSSP influenza ED level and recent
  lags; and MIGHTE-Linear, a partially pooled distributional autoregression. Each component receives
  one-third weight. Weights do not change with recent forecast performance. This replaces the previous
  adaptive ensemble. MIGHTE-Linear is separately submitted to this hub; the other component forecasts
  are internal.'
ensemble_of_models: true
ensemble_of_hub_models: true
backfill_adjustment: Complete observed histories are refreshed before every weekly fit using current
  hub and CDC releases. Revised observations replace earlier values; no blanket nowcast inflation
  is applied. Forecasts and input snapshots remain frozen.
