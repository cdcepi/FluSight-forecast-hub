methods: "Random walk on log(admissions + 1) from the last observed week, with symmetrized week-to-week differences."
data_inputs: "Weekly confirmed influenza hospital admissions from the NHSN Hospital Respiratory Data."
methods_long: "A log-scale version of the FluSight-baseline random walk. For each
  location, weekly admissions beginning with the week ending 2022-08-06 (excluding reporting weeks 2024-05-04 to 2024-11-02) are collected, 
  transformed to log(x + 1), and differenced between consecutive weeks.
  Each horizon (0 to 3) adds resampled differences to the last
  observed week, and the result is back-transformed with exp() - 1. The median is
  set to the last observed value at every horizon and the distribution is floored
  at 0. Locations are modelled independently. Developed as a
  benchmark for forecast skill scores (https://www.medrxiv.org/content/10.64898/2026.09.29.26364307v1)."
ensemble_of_models: false
