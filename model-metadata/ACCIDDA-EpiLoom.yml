methods: Ensemble of neural networks forecasting flu admissions and ED visit proportions,
  with reporting-revision-aware training, information shared across locations, and averaged
  predictive quantiles.
data_inputs: NHSN flu hospital admissions and NSSP flu ED visit share as reported at the forecast
  date (revision archives from Delphi Epidata), Kinsa smart-thermometer ILI (PopHIVE).
methods_long: EpiLoom combines two multilayer-perceptron forecasting recipes trained on the
  2022-23 through 2025-26 seasons to predict finalized weekly influenza hospital admissions
  and influenza ED visit proportions. The first recipe generates predictive samples and uses
  Kinsa covariates; its training histories are artificially degraded and then corrected using
  trees fitted to historical reported-to-final data pairs. The second recipe predicts quantiles
  directly and exchanges information between neighboring locations. Both recipes learn across
  locations. Each recipe has five independently seeded fits. Forecast quantiles are averaged
  with equal weight per recipe and equal weight per seed within each recipe. Predictive samples
  and directly estimated quantiles represent uncertainty. For prospective forecasts in 2026-27,
  the saved models use surveillance data available at the forecast date; the admissions correction
  trees are applied to reported inputs. Submitted forecasts cover horizons 0 through 3 relative
  to the Hub reference date.
