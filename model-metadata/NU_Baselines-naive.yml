methods: "Negative binomial fit by method of moments to every previous week."
data_inputs: "Weekly confirmed influenza hospital admissions from the NHSN Hospital Respiratory Data."
methods_long: "A naive baseline that ignores recent trends. For each location, a
  negative binomial distribution is fit by the method of moments to all reported
  weekly admissions beginning with the week ending 2022-08-06 (excluding reporting weeks 2024-05-04 to 2024-11-02).
  The quantiles of that distribution are replicated for every
  horizon. Locations are modelled
  independently. Developed as a benchmark for forecast skill scores
  (https://www.medrxiv.org/content/10.64898/2026.09.29.26364307v1)."
