methods: "Median-based ensemble of selected quantile forecasts submissions (bottom up approach)."
methods_long: "A median of quantile outputs is used for a subset of quantile based forecasts selected weekly. The top 10 performing forecasts based on WIS for the last 4 weeks are used as an initial ensemble, and then selected additional forecasts are eliminated based on human judgment and internal heuristics."
