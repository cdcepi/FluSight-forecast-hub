methods: "Online quantile calibration (MultiQT) applied post-hoc to the CMU-TimeSeries ensemble."
data_inputs: "Weekly incident flu hospitalizations and historical flusurv and ILI data, queried through Delphi Epidata API."
methods_long: "The CMU-TimeSeries ensemble (see CMU-TimeSeries.yml) with online quantile calibration applied via the MultiQT algorithm (Ding, Gibbs & Tibshirani 2025). Per (location, horizon) series, an additive offset over the 23 hub quantile levels is updated each round by online gradient descent on pinball loss, with an adaptive learning rate and isotonic projection. The tracker runs in sqrt-transformed space (lr_mult=0.03, lr_window=20) and carries a slow persistent term (lr_slow_mult=0.003)."
