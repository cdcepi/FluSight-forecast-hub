methods: "Median-based ensemble of selected quantile forecasts submissions (top down approach)."
data_inputs: "NHSN weekly incident flu hospitalizations, whichever other data inputs inform constituent models."
methods_long: "A median of quantile outputs is used for a subset of quantile based forecasts selected weekly. All contributing California forecasts are initially retained and then forecasts are eliminated based on certain heuristics, including unreasonably high or low median forecast values, trajectories deemed improbable, overly wide prediction intervals, and last 4 week rWIS score > 1."
