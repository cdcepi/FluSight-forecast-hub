license: "CC-BY-4.0"
designated_model: true
designated_targets: ["wk inc flu hosp"]
methods: "Renewal model using the PyRenew-HEW framework fit jointly to two epidemiological signals: hospital admissions and emergency department visits."
data_inputs: "Epiweekly incident Influenza hospital admissions from NHSN HRD via data.cdc.gov. Daily incident influenza emergency department visits via the National Syndromic Surveillance Program (NSSP)."
methods_long: "Renewal model fit to two signals and used to forecast the target (NHSN HRD) signal. This is the renamed successor to model ID `CFA_Pyrenew-Pyrenew_HE_Flu`; historical submissions retain that identifier."
