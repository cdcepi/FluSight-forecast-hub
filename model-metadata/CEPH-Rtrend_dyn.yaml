designated_model: true
data_inputs: "NHSN; ILINet; FluSurv-NET; various socio-economic data"
methods: "A renewal equation method based on Bayesian estimation of Rt and machine learning-based projections of future Rt trajectories, with the joint distribution of the parameters governing Rt temporal trends re-estimated dynamically each week."
methods_long: " Weekly influenza hospitalization data are preprocessed and used to estimate the time-varying reproduction number (Rt) within a Bayesian framework, assuming a generation time distribution informed by the literature. Future Rt trajectories are modeled using an exponential function with two forecast-date-dependent parameters. The joint distribution of these parameters is estimated using a machine learning approach trained on historical influenza seasons. A broad set of epidemiological, temporal, and environmental predictors is considered (e.g., cumulative hospitalizations, school calendars, calendar date) with predictors selected through a feature selection procedure. The preprocessed hospitalization time series and the estimated and projected Rt trajectories are used within a renewal equation framework to generate probabilistic forecasts of weekly influenza hospitalizations. The machine learning component is optimized to minimize the WIS of the resulting hospitalization forecasts. The model is retrained weekly using an expanding training window with a four-week lag."
