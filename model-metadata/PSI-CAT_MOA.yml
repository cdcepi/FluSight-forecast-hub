designated_model: true
data_inputs: "NHSN admissions and FluSurv-NET EIP/IHSP hospitalization rates for analogue histories; location populations"
methods: "Matches current-season admissions to up to five weighted historical analogue paths, adds resampled weekly-change noise, and converts quantiles to categorical probabilities."
methods_long: "For each of 50 states, DC, Puerto Rico, and the US, the model matches current MMWR season-to-date weekly confirmed influenza hospital admissions
  to candidate windows from historical seasons. It selects up to five low-RMSE windows subject to a start-week tolerance and a non-overlap rule.
  Inverse-RMSE weights combine the four following weekly admission values.
  A common additive adjustment aligns the weighted mean analogue endpoint with the latest admission count after reporting-coverage backfill
  adjustment, preserving differences among the selected paths. Predictive quantiles are generated by repeatedly sampling from a symmetrized empirical
  distribution of the configurable (initialy set to six) most recent week-to-week admission changes by
  default and cumulatively applying sampled changes across forecast weeks.
  A configurable noise-spread floor can widen uncertainty; its current default is 0.10 times the location's median admissions. 
  Quantiles are converted to probabilities for stable, increase, decrease, large increase, and large decrease using count and per-capita change thresholds."
ensemble_of_models: false
ensemble_of_hub_models: false
website_url: "https://www.predsci.com/usa-flu-hosp/"
citation: ""
team_funding: "CSTE/CDC: Development of Forecasts and/or Scenario Projections for Influenza to Inform Public Health Decision Making (Cooperative Agreement number NU38OT000297)."
backfill_adjustment: "The latest weekly admission count is multiplied by (1 + max_report / latest_report) / 2, where max_report is 
  the maximum reporting percentage within the current season and latest_report is the latest available reporting percentage."
baseline_model: false
designated_targets: "wk flu hosp rate change"
