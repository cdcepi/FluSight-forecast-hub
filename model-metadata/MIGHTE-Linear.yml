data_inputs: NHSN hospital admissions and historical ILINet/FluSurv-NET data.
methods: Partially pooled autoregression using hospitalization history and seasonality,
  with jointly estimated mean and uncertainty.
methods_long: A Gaussian model estimates hospitalization trajectories and uncertainty on a log
  scale. Partial pooling shares information across locations without explicit spatial covariance.
